[extension]
name = "remote"
display-name = "Orca Remote"
version = "0.4.2"
author = "Cody Hurst <codythurst@gmail.com>"
license = "LGPL-2.1-or-later"
url = "https://github.com/churst90/orca-remote"
description = """
NVDA-Remote-compatible remote access for Orca. Bidirectional
speech mirroring across an NVDA Remote v2.x relay: act as a
client (receive remote speech) or as a host (broadcast our
speech). Role and connect/disconnect chords are configurable;
key forwarding lands in a later release.
"""

[compatibility]
min-orca = "51.alpha"
last-tested-orca = "51.alpha"

[entry]
module = "remote"
class = "RemoteExtension"
